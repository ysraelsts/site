# Configuracao do site no Netlify.
#
# Este repositorio e PUBLICO no GitHub e so contem o que o visitante ve:
# paginas de vendas e as artes de compartilhamento. Nada de credencial,
# nada de documento interno, nada de preco, nada de arquivo de entrega.
# O material do produto (PDF, ZIP, planilhas, copy crua) vive em outro lugar,
# em C:\Donna\09_PRODUTOS\<nome-do-produto>\, e nunca entra no git.
#
# SEM bloco [build] de proposito.
#
# Sem build nao existe nada a compilar: o HTML ja sai pronto do _build, com a
# arte embutida em base64. A secao [build] foi removida porque um
# 'command = ""' explicito e a forma facil de o build do Netlify recusar o
# deploy, e a unica coisa que ele faz e publicar a raiz do repositorio,
# que e exatamente o padrao quando a secao nao existe.
#
# Conectar este repositorio ao site que ja esta no ar troca o conteudo
# servido, sem mexer na URL. Se o build falhar, o deploy anterior continua.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# As artes nao mudam de nome a cada versao, entao podem ficar em cache por
# muito tempo. O resto do site nao, para que uma correcao de copy apareca.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
